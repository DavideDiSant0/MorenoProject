publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  path: ^1.9.1
